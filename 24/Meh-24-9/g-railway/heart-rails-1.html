<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../res/main.css" />
<style>

/*  */

a { background: none; }

/*  */

body
{
	max-width: 100% ;
}

.app
{
	background-color: hsl( 0, 0%, 100% ) ;
}

.path-navi
{
	display: flex ;
	flex-direction: row ;
	justify-content: center ;
	background-color: hsl( 30, 10%, 0% , 0% );
}
.path-navi ul
{
	display: flex ;
	flex-direction: row ;
	flex-wrap: wrap ;
}
.path-navi li { white-space: nowrap; }
.path-navi li:not(:last-child)::after { padding-inline-start: 0.2ex ; content: ">" ; }

.ITEM_LIST
{
	display: flex ;
	flex-direction : row ;
	flex-wrap: wrap ;
	justify-content : center ;
	gap : 0.4ex 0.25ex ;
	background-color: hsl( 0, 0%, 100% ) ;
}
.ITEM_LIST li { word-break : keep-all ; }
.ITEM_LIST a
{
	display : block ;
	border-radius: 0.3ex ;
	padding : 0.75em 1.0em ;
	background-color: hsl( 0, 0%, 0% , 8% ) ;
}
.ITEM_LIST li.selected a
{
	background-color: hsl( 0, 0%, 8% ) ;
	color: hsl( 0, 0%, 90% ) ;
}

.station
{
	display : flex ;
	flex-direction: column ;
	align-items : center ;
	overflow: hidden ;

	background-color : hsl( 0, 0%, 100% ) ;
}
.station ._main
{
	background: none ;
	padding-block : calc( 20px + 4vw ) ;
	text-align : center ;
	white-space : nowrap ;
	font-size : 12vw ;
}
.station .info
{
	width: 100% ;
	display: flex ;
	flex-direction: row ;
	flex-wrap: wrap ;
	justify-content: center ;
	gap : 0 1.3em ;
	background-color: hsl( 0, 0%, 0% , 8% );
}
.station .ITEM_LIST
{
	max-height: 35vh ;
	overflow: auto ;
	font-size: clamp( 0.9em , 0.55rem + 1vw , 1.00rem ) ;
}

.Ranges { gap : 2px ; }

</style>
</head>
<body>
	<script type="module">
		
		import { main } from "../js-out-1/g-railway/heart-rails-1.js" ;

		main () ;

	</script>
</body>
</html>
