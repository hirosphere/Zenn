<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../res/main.css" />
<style>

/*  */

a:link { background: none; }

/*  */

body
{
	max-width: 100% ;
}

.app
{
	background-color: hsl( 0, 0%, 100% ) ;
	padding: 1px ;
}

.PATH_NAVI
{
	width: 97% ;

	display: flex ;
	flex-direction: row ;
	justify-content: center ;

	border-bottom: 0px solid hsl( 210 , 0% , 30% , 20% ) ;
	background-color: hsl( 30, 10%, 0% , 0% );
	padding: 0.4ex 1em ;

	font-size: clamp( 14px , 14px + ( 100vw - 360px ) * 0.01 , 16px );
	font-size : 16px ;
}
.PATH_NAVI ul
{
	display: flex ;
	flex-direction: row ;
	flex-wrap: nowrap ;

	padding: 0 ;
	gap : 0 ;
}
.PATH_NAVI li
{
	white-space: nowrap ;
	flex-shrink: 1 ;

	padding : 0 ;
}
.PATH_NAVI li:not(:last-child)::after
{
	padding-inline : 0.3ex ;
	content: ">" ;
}
.PATH_NAVI li a
{
	padding: 0.3ex ;
	border-bottom : 1px solid black ;
}


.ITEM_LIST
{
	max-height: 70vh ;
	overflow: auto ;

	display: flex ;
	flex-direction : row ;
	flex-wrap: wrap ;
	justify-content : center ;
	gap : 0.8ex 0.5ex ;
	
	background-color: hsl( 0, 0%, 100% ) ;
	padding: 1.0em ;
}
.ITEM_LIST li { word-break : keep-all ; }
.ITEM_LIST a:link
{
	display : block ;
	border-radius: 0.3ex ;
	padding : 0.75em 1.0em ;
	background-color: hsl( 0, 0%, 0% , 8% ) ;
}
.ITEM_LIST li.selected a
{
	background-color: hsl( 0, 0%, 8% ) ;
	color: hsl( 0, 0%, 90% ) ;
}

.STATION
{
	display : flex ;
	flex-direction: column ;
	align-items : center ;
	overflow: hidden ;

	background-color : hsl( 0, 0%, 100% ) ;
	padding: 0.2ex ;
}
.STATION ._MAIN
{
	background: none ;
	padding-block : calc( 35px + 4vw ) ;
	text-align : center ;
	white-space : nowrap ;
	font-size : 12vw ;
}
.STATION ._INFO
{
	width: 100% ;
	display: flex ;
	flex-direction: row ;
	flex-wrap: wrap ;
	justify-content: center ;
	gap : 0 1.3em ;
	background-color: hsl( 0, 0%, 0% , 8% );
}
.STATION .ITEM_LIST
{
	max-height: 35vh ;
	overflow: auto ;
	font-size: clamp( 0.9em , 0.55rem + 1vw , 1.00rem ) ;
}

a:hover { background-color: hsl( 0, 0%, 0% , 13% ); }

</style>
</head>
<body>
	<script type="module">
		
		import { main } from "../js-out-1/g-railway/heart-rails-1.js" ;

		main () ;

	</script>
</body>
</html>
