<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./q2.css" />
	<title>JMA-App 1</title>
<style>

body
{
	max-width: 960px ;
}

.tree-node
{
	margin-bottom: 1px ;
}

.node-head
{
	background-color: hsl( 0 , 0% , 0% , 0% );
	display: grid ;
	grid-template-columns: auto auto 1fr ;
	padding : 1px 0.7ex ;
	align-items: center ;
	gap: 1em ;
}

.node-head button
{
	border: 2px solid hsl( 0 , 0% , 60% ) ;
	width : 2.6ex ;
	height : 2.6ex ;
	padding: 0px ;
}

.node-body { display: none ; }
.node-body.expanded
{
	display: block ;
	border: 1px solid hsl( 0, 0% , 100% , 30% );
	margin-block : 0.5ex ;
	margin-inline-start : 2.2cqw ;
	padding : 0 1ex 0 1ex ;
}

</style>
</head>
<body>

<script type="module">

import { main } from "../js-out-1/q2/jma-app-1.js" ;

main ( "body" ) ;

</script>

</body>
</html>
