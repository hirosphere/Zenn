<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Web DB</title>
	<link rel="stylesheet" href="./q2.css" />

<style>

.record
{
	display : flex ;
	flex-direction: column ;
	gap : 1ex ;
	align-items : center ;
}

.record input
{
	max-width: 700px ;
	width : 100% ;
	padding: 0.45ex ;
	text-align: center ;
	font-size : 30px ;
	color: hsl( 0, 0%, 20% ) ;
}
.record textarea
{
	max-width: 700px ;
	width : 100% ;
	height : 8em ;
	padding: 0.55ex ;
	text-align: center ;
	line-height: 1.33em ;
	font-size : 24px ;
	color: hsl( 0, 0%, 20% ) ;
}

button
{
	border-radius: 0.25ex ;
	padding : 1ex 1em ;
}

.memo-pad
{
	margin-inline: max( 40% - 250px , 0px ) ;
	display : grid ;
	grid-template-rows : auto auto ;
	gap : 1ex ;
}

.memo-pad .-title
{
	min-width: 0px ;
	font-size: 30px ;
	color: hsl( 0, 0%, 20% );
}

.memo-pad .-text
{
	min-width: 0px ;
	height : 33em ;
	font-size: 15px ;
	font-family: 'Courier New', Courier, monospace ;
	color: hsl( 0, 0%, 20% ) ;
}

</style>

</head>
<body>
	<script type="module">

		import { main } from "../js-out-1/q2/web-db.js" ;

		main () ;

	</script>
</body>
</html>
