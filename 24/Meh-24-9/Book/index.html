<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* { box-sizing: border-box ; margin: 0 ; padding: 0 ; }
a { text-decoration: dotted; color : hsl( 0 , 0% , 20% ) ; }

.APP
{
	height : 100vh ;
	overflow : auto ;
	padding: 1.25ex ;
	display : grid ;
	grid-template-rows : 1fr auto ;
	gap : 0.6ex ;
	background-color: hsl( 100 , 0% , 0% ) ;
}

.APP_NAVI ,
.APP_CONTENT
{
	border-radius : 0.5ex ;
	background-color: hsl( 0 , 0% , 100% );
}

.APP_NAVI
{
	padding : 0.2ex ;

	display : flex ;
	flex-direction : column ;
	gap : 0.3ex ;
	overflow: auto;
}

.APP_NAVI > ul
{
	display: flex;
	flex-direction: row;
	list-style: none;
	gap: 0ex;

	overflow : auto ;
}

.APP_NAVI_PARTS
{
	font-size: 90% ;
}

a.APP_NAVI_LINK
{
	border-radius: 0.3ex ;
	border: 1px solid hsl( 0 , 0% , 50% );
	display: block;
	padding : 0.65ex 1.7ex ;
}

a.APP_NAVI_LINK:hover
{
	background-color: hsl( 0 , 0% , 90% );
}

a.APP_NAVI_LINK.SELECTED
{
	background-color: hsl( 0 , 0% , 0% ) ;
	color : hsl( 0 , 0% , 100% ) ;
}


.APP_CONTENT
{
	flex-grow : 1 ;
}

</style>
</head>
<body>
	<script type="module">
		import { main } from "../js-out-1/Book/App.js" ;
		main () ;
	</script>		
</body>
</html>
