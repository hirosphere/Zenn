<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*
{
	box-sizing: border-box ;
	
	margin: 0 ;
	padding: 0 ;

	tab-size : 4ex ;
}

html , input , textarea , button
{
	font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
}

h1 , h2 , h3 , h4 , h5 , h6
{
	text-align : center ;
}

a
{
	text-decoration : dotted ;
	color : hsl( 0 , 0% , 20% ) ;
}

button
{
	border-radius : 0.5ex ;
	padding : 0.6ex 0.6em ;
	font-size : 1rem ;
}

/* APP */

.APP
{
	height : 100vh ;
	overflow : auto ;
	padding: 0.5ex ;
	display : grid ;
	grid-template-rows : 2.5rem 1fr 2.5rem ;
	gap : 0.3ex ;
	background-color: hsl( 100 , 0% , 0% ) ;

	font-family: sans-serif;
}

.APP_NAVI ,
.APP_CONTENT ,
main
{
	border-radius : 0.5ex ;
	background-color: hsl( 0 , 0% , 100% );
	overflow: auto;
}

.APP_NAVI
{
	padding : 0.08ex ;

	display : flex ;
	justify-content : center ;
	gap : 0.6ex ;

	overflow: auto ;
}

.APP_NAVI li
{
	white-space: nowrap;
}

ul.APP_NAVI_PATH
{
	display: flex ;
	background-color :hsl( 0 , 0% , 100% ) ;
	
	padding : 0.8ex 1ex ;
	overflow : auto ;
	
	list-style : none ;
}
.APP_NAVI_PATH li:not(:last-child)::after
{
	padding-inline: 0.6ex ;
	content: ">" ;
	font-family: monospace ;
}
.APP_NAVI_PATH a
{
	padding : 0.2ex 0.6ex;
}


ul.APP_NAVI_ISOS
{
	margin-top : -0.4ex ;

	background-color: hsl( 90 , 0% , 100% );
	display : flex ;
	
	padding : 0ex 1ex 0.08ex 1ex ;
	overflow : auto ;
	gap : 0.5ex ;
	
	list-style : none ;
	font-size : 88% ;
}

.APP_NAVI_ISOS a
{
	border-radius: 0.5ex ;
	border: 1px solid hsl( 0 , 0% , 50% );
	display: block;
	padding : 0.9ex 1.7ex ;
}

ul.APP_NAVI_PARTS
{
	width : 100% ;
	max-height : 90vh ;

	display : inline-flex ;
	flex-wrap : wrap ;
	
	padding : 1ex ;
	justify-content : center ;
	gap : 0.5ex ;
	overflow : auto ;
	
	list-style : none ;
}

.APP_NAVI_PARTS a
{
	border-radius: 0.5ex ;
	border: 1px solid hsl( 0 , 0% , 50% );
	display: block;
	padding : 0.85ex 1.7ex ;
}

a.APP_NAVI_LINK:hover
{
	background-color: hsl( 0 , 0% , 90% );
}

a.APP_NAVI_LINK.SELECTED
{
	background-color: hsl( 0 , 0% , 0% ) ;
	color : hsl( 0 , 0% , 100% ) ;
}


.APP_CONTENT
{
	flex-grow : 1 ;
	padding : 1ex ;
}


.CLOCK_PAGE
{
	display: flex;
	justify-content: center ;
}
.CLOCK_PAGE ._MAIN
{
	font-size: min( 8vw + 5px , 42px );
}

.UIG_OKLCH
{
	display: flex;
	flex-direction: column;
	align-items: center;
}

</style>


<style id="EVAL_PAGE">

/* EVAL */

.EVAL_PAGE
{
	height : 100% ;
	display : grid ;
	grid-template-rows : auto 1fr ;

	padding : 1ex ;
	gap : 0.5ex ;
}

.EVAL_PAGE_BAR
{
	display : flex ;
	align-items : center ;
	gap : 1ex ;
}

.EVAL
{
	display : grid ;
	overflow: auto;
	gap : 0.15ex ;
}

@media( min-width : 800px )
{
	.EVAL
	{
		grid-template-columns: 62% 1fr;
	}
}

@media( max-width: 800px )
{
	.EVAL
	{
		grid-template-rows: 62% 1fr;
	}
}

.EVAL_EDIT
{
	display : flex ;
	flex-direction : column ;
	overflow : auto ;
	gap : 2px ;
}

.EVAL_EDIT textarea
{
	flex-grow: 1;

	resize : vertical ;
	padding : 0.5ex ;

	font-family : "Courier, Monaco, Lucida Console, Consolas, monospace" ;
	font-size: 1.15rem ;
	background-color : hsl( 225 , 57% , 38% ) ;
	color : hsl( 0 , 0% , 100% ) ;
}

.EVAL_EDIT textarea::selection
{
	background-color : hsl( 90 , 60% , 60% ) ;
	color : hsl( 0 , 0% , 0% ) ;
}

.EVAL_DISPLAY
{
	flex-grow : 45 ;

	background-color: hsl( 205 , 70% , 85% );
	overflow : auto ;
	padding : 0.5ex ;
}

</style>



</head>
<body>
	<script type="module">
		import { main } from "../js-out-1/Book/App.js" ;
		main () ;
	</script>		
</body>
</html>
