<style>

*
{
	box-sizing: border-box ;
	
	margin: 0 ;
	padding: 0 ;

	font-family: "Meiryo" , sans-serif ;
	tab-size : 4ex ;
}

html , input , textarea , button
{
	font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
}

h1 , h2 , h3 , h4 , h5 , h6
{
	text-align : center ;
}

a
{
	text-decoration : dotted ;
	color : hsl( 0 , 0% , 20% ) ;
}

button
{
	border-radius : 0.5ex ;
	padding : 0.6ex 0.6em ;
	font-size : 1rem ;
}

/* Container */

.BH { background-color: hsl( 0 , 0% , 100% ); }
.BS { background-color: hsl( 0 , 0% , 100% , 50% ); }

.OA { overflow : auto ; }

.FH { display : flex ;  flex-direction : row }
.FV { display : flex ;  flex-direction : column }

.JC { justify-content : center ; }
.AC { align-items : center ; }

.PXX { padding : 1ex ; gap : 1ex ; }
.PXP { padding : 1ex ; gap : 1px ; }
.PPX { padding : 1px ; gap : 1ex ; }
.PPP { padding : 1px ; gap : 1px ; }


/* APP */

.APP
{
	height : 100vh ;
	overflow : auto ;
	padding: 0.5ex ;
	display : grid ;
	grid-template-rows : 2.5rem 1fr 2.5rem ;
	gap : 0.3ex ;
	background-color: hsl( 100 , 0% , 0% ) ;

	font-family: sans-serif;
}

.APP_NAVI ,
.APP_CONTENT ,
main
{
	border-radius : 0.5ex ;
	background-color: hsl( 0 , 0% , 100% );
	overflow: auto;
}

.APP_NAVI
{
	padding : 0.08ex ;

	display : flex ;
	justify-content : center ;
	gap : 0.6ex ;

	overflow: auto ;
}

.APP_NAVI li
{
	white-space: nowrap;
}

ul.APP_NAVI_PATH
{
	display: flex ;
	background-color :hsl( 0 , 0% , 100% ) ;
	
	padding : 0.8ex 1ex ;
	overflow : auto ;
	
	list-style : none ;
}
.APP_NAVI_PATH li:not(:last-child)::after
{
	padding-inline: 0.6ex ;
	content: ">" ;
	font-family: monospace ;
}
.APP_NAVI_PATH a
{
	padding : 0.2ex 0.6ex;
}


ul.APP_NAVI_ISOS
{
	margin-top : -0.4ex ;

	background-color: hsl( 90 , 0% , 100% );
	display : flex ;
	
	padding : 0ex 1ex 0.08ex 1ex ;
	overflow : auto ;
	gap : 0.5ex ;
	
	list-style : none ;
	font-size : 88% ;
}

.APP_NAVI_ISOS a
{
	border-radius: 0.5ex ;
	border: 1px solid hsl( 0 , 0% , 50% );
	display: block;
	padding : 0.9ex 1.7ex ;
}

ul.APP_NAVI_PARTS
{
	width : 100% ;
	max-height : 90vh ;

	display : inline-flex ;
	flex-wrap : wrap ;
	
	padding : 1ex ;
	justify-content : center ;
	gap : 0.5ex ;
	overflow : auto ;
	
	list-style : none ;
}

.APP_NAVI_PARTS a
{
	border-radius: 0.2ex ;
	border: 1px solid hsl( 0 , 0% , 50% );
	display: block;
	padding : 1.2ex 1.8ex ;
}

a.APP_NAVI_LINK:hover
{
	background-color: hsl( 0 , 0% , 90% );
}

a.APP_NAVI_LINK.SELECTED
{
	background-color: hsl( 0 , 0% , 0% ) ;
	color : hsl( 0 , 0% , 100% ) ;
}


.AF0
{
	flex-grow : 1 ;

	display : flex ;
	flex-direction : column ;
	padding : 1ex ;
	gap : 1ex ;
}

/*  */

ul.TABS
{
	display : flex ;
	gap : 1px ;
	list-style : none ;
	cursor : default ;
}

.TABS > li
{
	border : 1px solid hsl( 0  0%  40% ) ;
	padding : 1ex ;
}

/*  */

.CLOCK_PAGE
{
	display: flex;
	justify-content: center ;
}
.CLOCK_PAGE ._MAIN
{
	font-size: min( 8vw + 5px , 42px );
}

</style>


<style id="EVAL_PAGE">

/* EVAL */

.EVAL_PAGE
{
	height : 100% ;
	display : grid ;
	grid-template-rows : auto 1fr ;

	padding : 1ex ;
	gap : 0.5ex ;
}

.EVAL_PAGE_BAR
{
	display : flex ;
	align-items : center ;
	gap : 1ex ;
}

.EVAL
{
	display : grid ;
	overflow: auto;
	gap : 0.15ex ;
}

@media( min-width : 900px )
{
	.EVAL
	{
		grid-template-columns: 62% 1fr;
	}
}

@media( max-width: 900px )
{
	.EVAL
	{
		grid-template-rows: 62% 1fr;
	}
}

.EVAL_EDIT
{
	display : flex ;
	flex-direction : column ;
	overflow : auto ;
	gap : 2px ;
}

.EVAL_EDIT textarea
{
	flex-grow: 1;

	resize : vertical ;
	padding : 0.5ex ;

	font-family : Consolas , monospace ;
	font-size: 1.15rem ;
	background-color : hsl( 225 , 57% , 38% ) ;
	color : hsl( 0 , 0% , 100% ) ;
}

.EVAL_EDIT textarea::selection
{
	background-color : hsl( 90 , 60% , 60% ) ;
	color : hsl( 0 , 0% , 0% ) ;
}

.EVAL_DISPLAY
{
	flex-grow : 45 ;

	background-color: hsl( 205 , 70% , 75% );
	height : 100% ;

	display : flex ;
	flex-direction : column ;
	justify-content : center ;
	align-items : center ;

	overflow : auto ;
	padding : 0.5ex ;
	text-align : center ;
}

/* forms */

.RANGE
{
	border-radius : 0.3ex ;
	min-width : min( 100vw , 700px ) ;
	background-color: hsl( 0 , 0% , 0% , 10% );

	display : grid ;
	grid-template-columns : 4em 1fr auto ;

	padding : 1.1ex ;
	gap : 1ex ;
}

.RANGE .value-unit
{
	display : grid ;
	grid-template-columns : 5ex 1em ;
}

._RANGES
{
	display : flex ;
	flex-direction : column ;
	align-items : center ;
	gap : 1px ;
}

/* UIG */

.UIG_COLOR_1 ._DISPLAY
{
	border-radius : 0.3ex ;
	height : 60vh ;
	display : flex ;
	flex-direction : column ;
	justify-content : center ;
	align-items : center ;
}

.UIG_COLOR_1 ._VALUE._W { color : hsl( 0 , 0% , 90% ) ; }
.UIG_COLOR_1 ._VALUE._B { color : hsl( 0 , 0% , 10% ) ; }

.UIG_COLOR_1 .RANGE { max-width : 500px ; }

</style>



</head>

	<script type="module">

		main () ;
