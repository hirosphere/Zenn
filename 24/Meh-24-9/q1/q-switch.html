<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Q-Switch</title>

<style>

*
{
	margin : 0 ;
	padding : 0 ;
	box-sizing : border-box ;
	font-family : 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif ;
}

html
{
	padding: 0 ;
	font-family: sans-serif ;
	color: hsl( 0, 0%, 8% ) ;
}

body
{
	display : flex ;
	flex-direction : column ;
	align-items : center ;
	gap : 1em ;
}

h1 , h2 , h3 , h4 , h5
{
	padding : 1ex 1em ;
	text-align: center ;
}

article
{
	width: 100% ;
	max-width: 40em ;

	display: flex ;
	flex-direction: column ;
	padding: 1em 1ex ;

	align-items: center ;
	gap : 1em ;

	background-color: hsla( 205 , 70% , 70% , 12% );
}

.fcol
{
	display: flex ;
	flex-direction: column ;
	padding: 1ex ;
	gap : 0.5ex ;
	align-items: center ;
}

button
{
	padding : 1ex 1em ;
}

.buttons
{
	display : flex ;
	gap : 3px ;
	align-items : stretch ;
	flex-wrap: wrap ;
}

.card
{
	width: 98% ;
	min-width: 0;
	border: 3px solid hsl( 0, 0%, 8% );
	border-radius: 1ex ;

	display: flex ;
	flex-direction: column ;
	justify-content: center ;
	align-items: center ;
	padding: 1em ;
	gap : 0.5ex ;
	
	font-size: clamp( 2.0em , 3.0em , 3.0em );
}

.card > .title
{
	margin: 0 ;
	padding : 0 ;
	line-height : 1 ;

	color :hsla( 300, 0%, 22% , 92% ) ;
}

.card > .text
{
	font-size : 0.45em ;

	color :hsla( 300, 0%, 100%, 80% ) ;
}

</style>

</head>
<body>

<script type="module">

import { main } from "../js-out-1/q1/q-switch.js" ;

main() ;

</script>

</body>
</html>
