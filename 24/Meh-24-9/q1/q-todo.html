<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*
{
	box-sizing: border-box ;
}

html
{
	color: hsl( 45 , 4% , 8% ) ;
}

body
{
	display: flex ;
	flex-direction: column ;
	align-items: center ;
	gap : 1em ;
}

.todo-app
{
	max-width: 40em ;
	display : flex ;
	padding: 0 0.8ex 0.8em ;
	flex-direction: column ;
	gap : 1em ;
}

h1
{
	text-align: center ;
}

button
{
	padding: 0.5ex 1ex ;
}

.fb
{
	display: flex ;
	gap : 0.5ex ;
	align-items: stretch ;
}

.post
{
	display: grid ;
	grid-template-columns: 1fr auto ;
	gap: 0.5ex ;
}

.post > .text
{
	min-inline-size: 0 ;
	font-size: 1.3em;
	padding: 0.4ex;
}

ul.todo-list
{
	padding: 0 ;
}

.todo-item
{
	display: grid ;
	padding-block: 0.6ex;
	border-bottom: 1px dotted hsl( 45 , 4% , 65% ) ;
	grid-template-columns: 3ex 1fr 2ex ;
	gap : 1ex ;
}

.todo-item > input[ type = "checkbox" ]
{
	width: 1.3em ;
	accent-color: hsl( 90, 50%, 50% ) ;
}

</style>

</head>
<body>
	<script type="module" src="../js-out-1/q1/q-todo.js"></script>
</body>
</html>
