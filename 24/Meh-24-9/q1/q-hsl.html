<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*
{
	box-sizing: border-box ;
	margin: 0 ;
	padding : 0 ;
}

html
{
	color : hsl( 35 0% 10% ) ;

	background-color: hsl( 40 8% 90% ) ;
}

body , main , article , section , h1
{
	border: 0px solid hsla( 212, 0%, 100%, 30% ) ;
	border-radius: 0.3ex ;
	background-color: hsla( 90, 50%, 100%, 30% );
	padding: 1ex ;
}

body
{
	display: flex ;
	flex-direction: column ;
	align-items: center ;
	gap: 1em ;
}

main
{
	width: 98% ;
	max-width: 60em ;
	display: flex ;
	flex-direction: column ;
	align-items: stretch ;
	gap: 1.2em ;

	container-type: size ;
}

h1 , h2 , h3
{
	padding: 1.5em ;
	text-align: center ;
}

.color_display
{

	border-radius: 1rex ;
	border-color: hsl( 35 0% 10% ) ;
	height: 22rem ;

	display: flex ;
	flex-direction: column ;
	justify-content: center ;
	align-items: center ;

	font-size: calc( 2cqw + 0.6em ) ;
}

.ranges
{
	margin-inline: max( 0px , ( 100cqw - 500px ) * 0.5 / 2 ) ;

	display: flex ;
	flex-direction: column ;
	padding: 0 ;
	gap : 1px ;
}

.range
{
	width : 100% ;
	padding: 1ex ;
	display: flex ;
	flex-wrap: wrap ;
	gap : 0 1ex ;
}

.range > ._name { width: 5ex; }
.range > ._input
{
	flex-grow: 1 ;
	accent-color: hsl( 95 70% 55% );
}
.range > ._value_unit
{
	display: grid ;
	grid-template-columns: 3ex 1em ;
	gap : 0.35ex ;
}

.range > ._value_unit > ._value
{
	text-align: right ;
}

</style>

</head>
<body>


<script type="module" >

import { main } from "../js-out-1/q1/q-hsl.js" ;
main () ;

</script>


</body>
</html>
