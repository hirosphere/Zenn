<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Book</title>

<style>

* { box-sizing : border-box ; margin : 0 ; padding : 0 ; }

.FR { display : flex ;  flex-direction : row ; }
.FC { display : flex ;  flex-direction : column ; }
.AC { align-items : center ; }
.PGMM { padding : 1em ;  gap : 1em ; }
.PGMX { padding : 1em ;  gap : 1ex ; }
.PGXX { padding : 1ex ;  gap : 1ex ; }



html
{
	height : 100% ;
	color : hsl( 0  0%  8% ) ;
}

body
{
	height : 100% ;
}

.NAVI_MODE_COL
{
	display : grid ;
	grid-template-columns : auto 1fr ;
}

.NAVI_MODE_ROW
{
	display : grid ;
	grid-template-rows : 1fr auto ;
}

button { padding : 1ex 1em ; }


/* Navigators */

.NAVI
{
	background-color : hsl( 200  80%  94% ) ;
	cursor : default ;
}

ul.PEER_NAVI > li > .TITLE
{
	border-radius : 0.18ex ;
	padding : 0.30ex  1ex 0.36ex ;
	overflow : hidden ;
	white-space : nowrap ;
}

ul.PEER_NAVI > li > .TITLE:hover
{
	background-color : hsl( 0  0%  0% / 3% ) ;
}

ul.PEER_NAVI > li.SELECTED > .TITLE
{
	background-color : hsl( 0  0%  0% / 80% ) ;
	border-color : hsl( 0  0%  0% / 0% ) ;
	color : hsl( 0  0%  90% ) ;
}

.NAVI_MODE_COL > .NAVI
{
	width : calc( 180px + 5vw ) ;

	display : grid ;
	grid-template-rows : 1fr auto ;
	padding : 1em 0.3ex ;
	text-align : center ;

	color : hsl( 0  0%  15% ) ;
}

.NAVI_MODE_COL > .NAVI > .PEER_NAVI_SWITCH
{
	margin-block : auto ;
}

.NAVI_MODE_COL > .NAVI  ul.PEER_NAVI > li
{
	border-bottom : 1px  solid  hsl( 0  0%  0% / 0% ) ;
	padding-block : 0.1ex ;
	list-style : none ;
}

.NAVI_MODE_COL > .NAVI  ul.PEER_NAVI > li > .TITLE
{
	display : block ;
}


.NAVI_MODE_ROW > .NAVI
{
	order : 2 ;

	display : grid ;
	grid-template-columns : 1fr auto ;
	align-items : center ;
	padding : 0.1ex ;
}

.NAVI_MODE_ROW > .NAVI > .PEER_NAVI_SWITCH
{
	margin-inline : auto ;
}

.NAVI_MODE_ROW > .NAVI  ul.PEER_NAVI
{
	display : flex ;
}

.NAVI_MODE_ROW > .NAVI  ul.PEER_NAVI > li
{
	border-bottom : 1px  solid  hsl( 0  0%  0% / 0% ) ;
	padding-block : 0.1ex ;
	list-style : none ;
}

.NAVI_MODE_ROW > .NAVI  ul.PEER_NAVI > li::after
{
	padding-inline : 0.25ex ;
	content : "|" ;
	color : hsl( 45  5%  70% ) ;
}

/* */

main
{
	height : 100% ;
	overflow : auto ;
}

</style>


</head>

<body>
	<script type="module" src="../js-out-1/Book/App.js" ></script>
</body>


</html>
