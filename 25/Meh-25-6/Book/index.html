<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Book</title>

<style>

* { box-sizing : border-box ; margin : 0 ; padding : 0 ; }

.FR { display : flex ;  flex-direction : row ; }
.FC { display : flex ;  flex-direction : column ; }
.AC { align-items : center ; }
.PGMM { padding : 1em ;  gap : 1em ; }
.PGMX { padding : 1em ;  gap : 1ex ; }
.PGXX { padding : 1ex ;  gap : 1ex ; }



html
{
	height : 100% ;
	background : linear-gradient( 180deg , hsl( 210  70%  80% ) , hsl( 217  100%  100% ) ) ;
}

html
{
	color : hsl( 0  0%  12% ) ;
	font-family : 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif ;
}


/* body */

body { height : 100% ; }

body.NAVI_BLOCK
{
	display : flex ;
	flex-direction : row ;
}

body.NAVI_INLINE
{
	display : flex ;
	flex-direction : column ;
}


/* Navi */

.NAVI
{
	background-color : hsl( 210  60%  91% ) ;
}

.NAVI .TREE
{
	cursor : default ;
}

.NAVI .INDEX_HEAD
{
	background-color : hsl( 0  0%  100% / 90% ) ;

	display : flex ;
	align-items : center ;
}

.NAVI .INDEX_HEAD:hover
{
	background-color : hsl(  0  0%  95% / 90% ) ;
}

.NAVI .INDEX_HEAD._SELECTED
{
	background : hsl( 0  0%  0% / 85% ) ;
	color : hsl( 0  0%  90% ) ;
}


.NAVI .INDEX_THUMB:hover
{
	background-color : hsl( 0  0%  50% / 50% ) ;
	color : hsl( 0  0%  90% ) ;
}

.NAVI .INDEX_PARTS
{
	font-size : 98.0% ;
}

.NAVI ._LINK
{
	text-decoration : none ;
	color : hsl( 0  0%  0% / 80% ) ;
}

.NAVI .CLOCK
{
	font-family : 'Consolas', monospace ;
}




/*	NAVI > BLOCK */

.NAVI_BLOCK .NAVI
{
	width : calc( 180px + 8vw ) ;
	display : grid ;
	grid-template-rows :  1fr  auto ;

	padding-block : 4vh  0.6vh ;
	padding-inline : 0.3vw  0.3vw ;
	gap : 1ex ;
}

.NAVI_BLOCK .TREE
{
	overflow-y : scroll ;
	padding-inline : 1.6vw  0.2ex ;
}

.NAVI_BLOCK .INDEX_HEAD
{
	border-radius : 0.6ex 0.1ex  0.1ex  0.6ex ;
	border-bottom : 1px  dotted  hsl( 0  0%  0% / 35% ) ;

	display : grid ;
	grid-template-columns : 1fr auto ;

	padding : 0 ;
	align-items : stretch ;
}

.NAVI_BLOCK .INDEX_TITLE
{
	border-left : 1px solid hsl( 45  4%  50% ) ;
	padding : 0.6ex 1em ;
}

.NAVI_BLOCK .INDEX_THUMB
{
	padding : 0.5ex  1.5ex ;
	font-family : Courier, monospace ;
}

.NAVI_BLOCK .INDEX_PARTS { display : none ; }

.NAVI_BLOCK .INDEX_PARTS._OPEN
{
	margin : 0.3ex 0  0.3ex ;
	border-radius : 1ex 0  0 1ex ;
	border : solid  hsl( 230  45%  45% / 40% ) ;
	border-width : 0.1ex  0  0.1ex 1.0ex ;
	padding : 0.3ex  0.0ex  0.3ex  0.3ex ;

	display : block ;
	overflow : hidden ;
	transition : height  1.1s ;
}

.NAVI_BLOCK ul
{
	list-style : none ;
	border-radius : 1ex 0.1ex  0.1ex 1ex ;
	overflow : hidden ;
}

.NAVI_BLOCK .CLOCK
{
	border-radius : 0.9ex ;
	background : hsl( 0  0%  100% / 40% ) ;
	display : block ;
	padding : 0.8ex  1ex ;
	text-align : center ;
	font-size : 122% ;
	font-family : 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif ;
}

.NAVI_BLOCK .TREE footer
{
	height : 60% ;
}



/*	NAVI > INLINE */

.NAVI_INLINE .NAVI
{
	order : 1 ;
	display : flex ;

	padding : 0px 1vw 3px ;
	align-items : stretch ;
	gap : 1ex ;
	flex-wrap : nowrap ;
}

.NAVI_INLINE .TREE
{
	order : 1 ;
	flex-grow : 1 ;

	display : flex ;
	overflow-x : scroll ;
	scrollbar-width : none ;
	padding :  0ex  1ex  0.3ex 1ex ;
}

.NAVI_INLINE .INDEX
{
	display : flex ;
	align-items : stretch ;
}

.NAVI_INLINE .INDEX_HEAD
{
	border : 0.2ex  solid  hsl( 0  0%  40% / 60% ) ;
	border-radius : 0.1ex 0.1ex 1.7ex 1.7ex ;

	min-height : 1.8em;
	display : flex ;
	padding-inline : 1.2em ;
	align-items : stretch ;
	gap : 1ex ;
}

.NAVI_INLINE .INDEX_TITLE
{
	white-space : nowrap ;
	display : flex ;
}

.NAVI_INLINE .INDEX_THUMB
{
	margin-right : -1.5em ;
	border-radius : 0.3ex ;
	border : 0px solid  hsl( 0  0%  80% ) ;
	display : none ;
	padding : 0.0ex  1.0ex ;
	font-family : monospace ;
	font-size : 0.9em ;
	color : hsl( 0  0%  40% ) ;
}

.NAVI_INLINE .INDEX_THUMB._HAS_PARTS { display : block ; }



.NAVI_INLINE .INDEX_PARTS { display : none ; }

.NAVI_INLINE .INDEX_PARTS._OPEN
{
	border : solid  hsl( 0  0%  0% / 35% ) ;
	border-width : 0  0.3ex  0.07ex  0.8ex ;
	border-radius : 0.1ex 0.1ex  1.0ex 1.6ex ;
	border-bottom-color : hsl( 0  0%  0 / 9% ) ;

	background-color : hsl( 180  100%  100% / 3% ) ;

	display : block ;
	
	margin-inline : 0.5ex  0.3ex ;
	padding-inline : 0.6ex  0.7ex ;
	padding-block : 0  0.1ex ;
}

.NAVI_INLINE ul
{
	list-style : none ;
	overflow : hidden ;
	display : flex ;
	gap : 0.2ex ;
	align-items : stretch ;
}

.NAVI_INLINE .TREE ul
{
	display : flex ;
	align-items : stretch ;
}

.NAVI_INLINE .TREE li
{
	display : flex ;
	align-items : stretch ;
}



.NAVI_INLINE  .CLOCK
{
	display : flex ;
	justify-content : center ;
	align-items : center ;
}

.NAVI_INLINE  .CLOCK_LINK
{
	border-radius : 0.9ex ;
	padding : 0.7ex 1vw ;
	white-space : nowrap ;
	font-size : 1.1em ;
}

.NAVI_INLINE .TREE > footer
{
	width : 10em ;
}


/* CONTENT */

.CONTENT_SWITCH
{
	width : 100% ;
	height : 100% ;
	overflow : hidden ;
}

.CONTENT_FRAME
{
	height : 100% ;
	overflow : auto ;
	display : none ;
}

.CONTENT_FRAME.CURRENT { display : block ; }

.DEFAULT_CONTENT
{
	width : 100% ;
	height : 100% ;

	color : hsl( 0  0%  10% ) ;

	display : flex ;
	flex-direction : column ;
	justify-content : center ;
	align-items : center ;

	padding : 1em ;
}

</style>


</head>

<body>
	<script type="module" src="../js-out-1/Book/App.js" ></script>
</body>


</html>
