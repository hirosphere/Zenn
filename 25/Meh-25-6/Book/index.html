<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Book</title>

<style>

* { box-sizing : border-box ; margin : 0 ; padding : 0 ; }

.FR { display : flex ;  flex-direction : row ; }
.FC { display : flex ;  flex-direction : column ; }
.AC { align-items : center ; }
.PGMM { padding : 1em ;  gap : 1em ; }
.PGMX { padding : 1em ;  gap : 1ex ; }
.PGXX { padding : 1ex ;  gap : 1ex ; }



html
{
	height : 100% ;
	color : hsl( 0  0%  8% ) ;
}

body
{
	height : 100% ;
}

.LM_HORIZ
{
	display : grid ;
	grid-template-columns : auto 1fr ;
}

.LM_VERT
{
	display : grid ;
	grid-template-rows : 1fr auto ;
}

button { padding : 1ex 1em ; }


/* Navigators */

.NAVI
{
	background-color : hsl( 205  90%  92% ) ;
}

.LM_HORIZ > .NAVI
{
	width : calc( 180px + 5vw ) ;

	display : grid ;
	grid-template-rows : 1fr auto ;
	padding : 1ex ;
	text-align : center ;
}


.LM_VERT > .NAVI
{
	order : 2 ;

	display : grid ;
	grid-template-columns : 1fr auto ;
	align-items : center ;
	padding : 0.30ex ;
}

/* */

main
{
	height : 100% ;
	overflow : auto ;
}

</style>


</head>

<body>
	<script type="module" src="../js-out-1/Book/App.js" ></script>
</body>


</html>
