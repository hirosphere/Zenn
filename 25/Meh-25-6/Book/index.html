<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Book</title>

<style>

* { box-sizing : border-box ; margin : 0 ; padding : 0 ; }

.FR { display : flex ;  flex-direction : row ; }
.FC { display : flex ;  flex-direction : column ; }
.AC { align-items : center ; }
.PGMM { padding : 1em ;  gap : 1em ; }
.PGMX { padding : 1em ;  gap : 1ex ; }
.PGXX { padding : 1ex ;  gap : 1ex ; }



html
{
	height : 100% ;
	color : hsl( 0  0%  15% ) ;
}

html
{
	font-family : 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif ;
}


/* body */

body { height : 100% ; }

body.NAVI_BLOCK
{
	display : flex ;
	flex-direction : row ;
}

body.NAVI_INLINE
{
	display : flex ;
	flex-direction : column ;
}


/* Navi */

.NAVI
{
	background-color : hsl( 200  70%  95% ) ;
}

.NAVI ._LINK
{
	text-decoration : none ;
	color : hsl( 0  0%  0% / 85% ) ;
}

.NAVI  .CLOCK { display : block ;  text-align : center ; }

.NAVI .TREE { cursor : default ; }

.NAVI .INDEX.SEL > .INDEX_HEAD
{
	background : hsl( 0  0%  0% / 90% ) ;
	color : hsl( 0  0%  90% ) ;
}

.NAVI .INDEX.SEL > .INDEX_HEAD > ._LINK
{
	color : hsl( 0  0%  90% ) ;
}

.NAVI .INDEX_THUMB
{
	cursor : default ;
	padding : 0.0ex  1.0ex ;
	font-family : Courier, monospace ;
}

.NAVI .INDEX_THUMB:hover { background-color : hsl( 0  0%  100% / 15% ) ; }


/*	NAVI > BLOCK */

.NAVI_BLOCK .NAVI
{
	width : calc( 180px + 6vw ) ;
	display : grid ;
	grid-template-rows :  1fr  auto ;

	padding : 1ex ;
}

.NAVI_BLOCK .INDEX_HEAD
{
	display : grid ;
	grid-template-columns : 1fr auto ;

	padding : 0.6ex 0.6ex 0.9ex 1ex ;
}

.NAVI_BLOCK .INDEX_PARTS
{
	margin : 0.2ex ;
	padding : 1ex ;
	list-style 	: none ;
}



/*	NAVI > INLINE */

.NAVI_INLINE .NAVI
{
	order : 1 ;
	display : grid ;
	grid-template-columns : 1fr auto ;

	padding : 0.5ex 1vw ;
}

.NAVI_INLINE .INDEX
{
	display : inline ;
}

.NAVI_INLINE .INDEX_HEAD
{
	display : inline-flex ;
	padding : 0.4ex 0.4ex 0.4ex 1.3ex ;
	gap : 1ex ;
}

/* CONTENT */

.CONTENT_SWITCH
{
	width : 100% ;
	height : 100% ;
	overflow : hidden ;
}

.CONTENT_FRAME
{
	height : 100% ;
	overflow : auto ;
	display : none ;
}

.CONTENT_FRAME.CURRENT { display : block ; }

.DEFAULT_CONTENT
{
	width : 100% ;
	height : 100% ;

	display : flex ;
	flex-direction : column ;
	justify-content : center ;
	align-items : center ;

	padding : 1em ;
}

</style>


</head>

<body>
	<script type="module" src="../js-out-1/Book/App.js" ></script>
</body>


</html>
