<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Book</title>

<style>

* { box-sizing : border-box ; margin : 0 ; padding : 0 ;  line-height : 1 ; }

.FR { display : flex ;  flex-direction : row ; }
.FC { display : flex ;  flex-direction : column ; }
.AC { align-items : center ; }
.PGMM { padding : 1em ;  gap : 1em ; }
.PGMX { padding : 1em ;  gap : 1ex ; }
.PGXX { padding : 1ex ;  gap : 1ex ; }



html
{
	height : 100% ;
	
}

html
{
	color : hsl( 0  0%  12% ) ;
}


/* body */

body { height : 100% ; }

body.NAVI_BLOCK
{
	display : flex ;
	flex-direction : row ;
}

body.NAVI_INLINE
{
	display : flex ;
	flex-direction : column ;
	overflow : hidden ;
}


/* Navi */

.NAVI
{
	background : hsl( 210  50%  94% ) ;
}

.NAVI .TREE
{
	cursor : default ;
}

.NAVI .INDEX_HEAD
{
	background-color : hsl( 0  0%  100% ) ;

	display : flex ;
	align-items : center ;
}

.NAVI .INDEX_HEAD:hover
{
	background-color : hsl(  0  0%  95% ) ;
}

.NAVI .INDEX_HEAD._SELECTED
{
	background : hsl( 0  0%  0% / 85% ) ;
	color : hsl( 0  0%  90% ) ;
}

.NAVI .INDEX_THUMB { display : none ; }
.NAVI .INDEX_THUMB._HAS_PARTS { display : block ; }

.NAVI .INDEX_THUMB:hover
{
	background-color : hsl( 0  0%  50% / 50% ) ;
	color : hsl( 0  0%  90% ) ;
}

.NAVI_INDEX
{
	font-size : 98% ;
}

.NAVI ._LINK
{
	text-decoration : none ;
	color : hsl( 0  0%  20% ) ;
}

.NAVI > .CLOCK > .CLOCK_BUTTON
{
	width : 100% ;
	height : 100% ;

	border-radius : 0.1ex ;
	border : none ;
	background : hsl( 200  20%  80% ) ;

	display : flex ;
	flex-wrap : wrap ;
	justify-content : center ;
	align-items : center ;
	gap : 0.2ex  1ex ;
	
	font-family : 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif ;
}

.NAVI .CLOCK span { white-space : nowrap ; }
.NAVI .CLOCK ._YMD { font-size : 1.0em ; font-weight : 300 ; }
.NAVI .CLOCK ._B   { font-size : 0.9em ; font-weight : 300 ; }
.NAVI .CLOCK ._HMS { font-size : 2.8em ; font-weight : 300 ; }



/*	NAVI > BLOCK */

.NAVI_BLOCK .NAVI
{
	width : calc( 100px + 13vw ) ;
	display : grid ;
	grid-template-rows :  1fr  auto ;

	gap : 0.7ex ;
}

.NAVI_BLOCK .TREE
{
	overflow-y : scroll ;
	scrollbar-width : none ;
	padding-block : 2em 1em ;
	padding-inline : 1.6vw  0.2ex ;
}

.NAVI_BLOCK .INDEX_HEAD
{
	border-radius : 0.5ex 0.1ex  0.1ex  0.5ex ;
	border-left : 0.1ex  solid  hsl( 26  0%  40% ) ;
	border-bottom : 1px  dotted  hsl( 0  0%  0% / 35% ) ;

	display : grid ;
	grid-template-columns : 1fr auto ;

	padding : 0.2ex ;
	align-items : stretch ;
}

.NAVI_BLOCK .INDEX_TITLE
{
	margin-inline : min( 1.7vw , 0.8em )  0.4vw ;
	padding-block : 1.0ex ;
	overflow : hidden ;
	white-space : nowrap ;
}

.NAVI_BLOCK .INDEX_THUMB._HAS_PARTS
{
	margin : 0.1px ;
	padding : 0.5ex  0.8ex ;
	font-family : Courier, monospace ;
}

.NAVI_BLOCK .INDEX_PARTS { display : none ; }

.NAVI_BLOCK .INDEX_PARTS._OPEN
{
	margin : 0.3ex 0  0.3ex ;
	border-radius : 0.1ex 0  0 0.8ex ;
	border : solid  hsl( 220  10%  65% ) ;
	border-width : 0.1ex  0ex  0.1ex  0.2ex ;
	padding-block : 0.3ex  0.3ex ;
	padding-inline : 0.5ex  0.0ex ;

	display : block ;
	overflow : hidden ;
}

.NAVI_BLOCK ul
{
	list-style : none ;
	border-radius : 1ex 0.1ex  0.1ex 1ex ;
	overflow : hidden ;
}

.NAVI_BLOCK .CLOCK
{
	margin : 0.0ex ;
	border-radius : 0.9ex ;
	display : block ;
	padding-block : 0.34ex ;
	text-align : center ;

	overflow : hidden ;
}

.NAVI_BLOCK .NAVI .CLOCK_BUTTON
{
	padding : 1.0em  1em ;
	font-size : min( 1.0em , 0.3ex + 1.0vw ) ;
}

.NAVI_BLOCK .TREE footer
{
	height : 60vh ;
}



/*	NAVI > INLINE */

.NAVI_INLINE .NAVI
{
	order : 1 ;

	border-top : 0.2ex  solid  hsl( 0  0%  40% ) ;
	display : flex ;

	padding-block : 0px ;
	padding-inline : 0.0vw ;

	justify-content : center ;
	align-items : stretch ;
	flex-wrap : wrap ;
}

.NAVI_INLINE .TREE
{
	flex-grow : 10 ;

	display : flex ;
	overflow-x : scroll ;
	scrollbar-width : none ;

	padding-block : 0ex 0.4ex ;
	padding-inline : 1ex ;
	justify-content : center ;
	align-items : start ;
}

.NAVI_INLINE .NAVI_INDEX
{
	display : flex ;
	align-items : start ;
}

.NAVI_INLINE .INDEX_HEAD
{
	margin-bottom : 0.0ex ;
	margin-right : 0.5ex ;

	overflow : hidden ;

	border : 0.2ex  solid  hsl( 0  0%  40% / 75% ) ;
	border-top-width : 0 ;
	border-radius : 0.1ex 0.1ex 0.0ex 0.0ex ;

	max-width : 12em ;
	min-width : 6em ;

	display : flex ;
	padding-inline : 1.0em ;
	align-items : stretch ;
	gap : 1ex ;
}

.NAVI_INLINE .INDEX_TITLE
{
	flex-grow : 1 ;
	padding-block : 0.6ex 1.2ex ;
	white-space : nowrap ;
	overflow : hidden ;
	text-align : center ;
}

.NAVI_INLINE .INDEX_THUMB._HAS_PARTS
{
	margin-right : -1.5em ;
	border-radius : 0.0ex ;
	border : 0px solid  hsl( 0  0%  80% ) ;
	
	display : flex ;
	padding : 0.8ex  1.0ex  0 ;
	font-family : monospace ;
	font-size : 0.9em ;
	color : hsl( 0  0%  40% ) ;
}



.NAVI_INLINE .INDEX_PARTS { display : none ; }

.NAVI_INLINE .INDEX_PARTS._OPEN
{
	border : solid  hsl( 0  0%  70% ) ;
	border-width : 0  0.2ex  0.00ex  0.5ex ;
	border-radius : 0.1ex 0.1ex  1.0ex 1.0ex ;

	display : block ;
	
	padding-inline : 0.6ex  0.6ex ;
	padding-block : 0  0.0ex ;
}

.NAVI_INLINE ul
{
	list-style : none ;
	overflow : hidden ;
	display : flex ;
	gap : - 0.2ex ;
	align-items : start ;
}

.NAVI_INLINE .TREE li
{
	display : flex ;
	align-items : start ;
}


.NAVI_INLINE  .CLOCK
{
	flex-grow : 1.01 ;

	display : flex ;
	padding : 0.1ex ;
	justify-content : center ;
	align-items : center ;
}

.NAVI_INLINE  .CLOCK_BUTTON
{
	padding-block : 0.2ex ;
	padding-inline : 2.2ex ;
	white-space : nowrap ;
}

.NAVI_INLINE .TREE > footer
{
	width : 10em ;
}


/* CONTENT */

.CONTENT_SWITCH
{
	width : 100% ;
	height : 100% ;
	overflow : hidden ;
}

.CONTENT_FRAME
{
	height : 100% ;
	overflow : auto ;
	display : none ;
}

.CONTENT_FRAME.CURRENT { display : block ; }

.DEFAULT_CONTENT
{
	width : 100% ;
	height : 100% ;

	color : hsl( 0  0%  10% ) ;

	display : flex ;
	flex-direction : column ;
	justify-content : center ;
	align-items : center ;

	padding : 1em ;
}

</style>


</head>

<body>
	<script type="module" src="../js-out-1/Book/App.js" ></script>
</body>


</html>
