<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>駅データ-1</title>
<style>

* {  box-sizing : border-box ;  margin : 0 ;  padding : 0 ; }

body
{
	padding : 1ex max( 1ex , 1vw ) ;
	color : oklch( 35%  0%  80 ) ;
}

h1 , h2 , h3 , h4 , h5
{
	padding : 2em 1ex ;
}



ul
{
	cursor : default ;
	list-style : none ;
}

li
{
	border-bottom : 1px dotted oklch( 0.4  0.0  80 );
}

li:hover
{
	border-bottom : 1px solid oklch( 50%  100%  150 );
}

.BV
{
	display : flex ;
	flex-direction : column ;
	gap : 0.38ex ;
}

.BH_1P
{
	display : flex ;
	gap : 1px ;
}

.FH { display : inline-flex ; }
.AC { align-items : center ; }

.ROW
{
	display : flex ;
	gap : 1px ;
	align-items: stretch ;
}

.COLUMNSET
{
	display : inline-flex ;
	flex-wrap : wrap ;
	align-items : stretch ;
	gap : 1px ;
}

.COLUMN
{
	display : inline-flex ;
	background-color: oklch( 50%  1.0%  85 / 10% );
	box-sizing : content-box ;

	overflow : hidden ;
	padding : 0.25ex 1.1ex ;
	justify-content : center ;
	align-items : center ;
	
	white-space : nowrap ;
}

</style>

</head>
<body>
	<main class="Box"></main>

<script type="module">

import { ef as $ , DOM , log } from "../js-out-1/Meh/Meh.js" ;
import { Eki } from "../js-out-1/API/Eki.js" ;

const Quest = new function ()
{
	this.Q1 = ( eki ) =>
	{
		// const lines = [ "11302" , "11311" ].map ( cd => eki.line.get ( cd ) ) ;
		const lines = Array.from ( eki.line.values () ).splice ( 57 , 30 ) ;

		const q = eki.qst () ;
		return $.article
		(
			{ class : "BV" } ,

			... lines.map ( line => Line_Q ( line ) ) ,
		) ;
	}

	const Stat_Q = ( eki ) =>
	{
		const sl = [ "2200106" , "2200402" , "2200702" , "2200901" ] ;

		return [

			$.h3 ( "Station" ) ,
			$.ul
			(
				... sl.map ( ( cd , i ) => Station ( eki.station.get ( cd ) , i ) )
			) ,
		] ;
	}

	const Line_Q = ( line ) =>
	{
		// return $.p ( line.stations.map ( m => m.station_name ) .join( " , " ) ) ;

		return $.section
		(
			{  } ,
			$.h2 ( line.line_cd + " " + line.line_name ) ,
			$.ul
			(
				{  } ,
				... line.stations.map ( ( m , i ) => Station ( m , i ) )
			) ,
		) ;
	}

}

const Root = ( index ) => $.section
(
	$.h1 ( index.title ) ,
) ;

const Line = ( m , i ) => $.li
(
	{ class : "ROW" } ,

	columnset
	(
		column ( i + 1 , { fontWeight : "bold" } ) ,
	) ,

	columnset
	(
		columnset
		(
			column ( m.line_cd ) ,
			column ( m.line_name , { minWidth : "8em" , textAlign : "left" } ) ,
		) ,
	) ,
) ;

const Station = ( m , i ) =>
{
	const prev = m.prev.length ?  "← " + m .prev .map ( m => m.station_name ) .join ( "・" ) : "" ;
	const next = m.next.length ?  m .next .map ( m => m.station_name ) .join ( "・" ) + " →" : "" ;

	return $.li
	(
		{ class : "ROW" } ,
		
		columnset
		(
			"0 0" ,
			column ( i + 1 , { width : "3ex" , fontWeight : "bold" } ) ,
		) ,

		columnset
		(
			"1 1" ,
			columnset
			(
				"1 0 auto" ,
				column ( m.station_cd , { flex : "1" } , "cd" ) ,
				column ( m.station_g_cd , { flex : "1" } , "g_cd" ) ,
				column ( m.e_sort , { flex : "1" } , "sort" ) ,
			) ,

			columnset
			(
				"1 0 auto" ,
				column ( m.station_name , { flex : "1 0 15em" , } , m.station_name ) ,
			) ,

			columnset
			(
				"1 0 auto" ,
				column ( "〒" + m.post , { flex : "1 0 5em" } ) ,
				column ( m.address , { flex : "1 0 14em" , justifyContent : "left" } , m.address ) ,
			) ,

			columnset
			(
				"1 0 auto" ,
				column ( prev , { flex : "1 0 8em" , justifyContent : "left" } , prev ) ,
				column ( next , { flex : "1 0 8em" , justifyContent : "right" } , next )
			) ,

			columnset
			(
				"" ,
				column ( m.lat , { width : "11ex" } , "北緯" ) ,
				column ( m.lon , { width : "11ex" } , "東経" ) ,
				column ( m.pref_name , { width : "4em" , textAlign : "center" } ) ,
			) ,

			column ( "" , { flex : "1" } ) ,
		) ,
	) ;
}

const columnset = ( flex , ... parts ) => $.span ( { class : "COLUMNSET" , style : { flex } } , ... parts ) ;
const column = ( text , style , title ) => $.span ( { class : "COLUMN" , attrs : { title } , style } , text ) ;



const main = async () =>
{
	const eki = await Eki () ;
	DOM.add ( Quest.Q1 ( eki ) , "main" ) ;
	// window.scrollTo ( { top : 0 } ) ;
}

main () ;







</script>

<footer style="height : 20em ;"></footer>

</body>
</html>
