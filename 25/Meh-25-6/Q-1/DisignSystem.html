<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Design System</title>
<style>

* {  box-sizing : border-box ;  margin : 0 ;  padding : 0 ; }

html
{
	background-color: oklch( 0.8  0.2  140 / 0.7 );
}

html
{
	color : oklch(  0.40  0.0  0 ) ;
}

body
{
	padding : 0.4ex ;
}

h1 , h2 , h3 , h4
{
	border-radius : 0.5ex ;
	background-color: oklch(  0.0  0  0 / 0.8 );
	padding : 2.5ex 1ex ;
	text-align : center ;
	color : oklch(  1.0  0.0  0  ) ;
}

ul
{
	list-style : none ;
}

.FH_CMD_WR
{
	display : flex ;
	flex-direction : row ;
	flex-wrap : wrap ;
	overflow : auto ;
	padding : 1ex ; gap : 1ex ;
}

.FH_CMD > *
{
	white-space : nowrap ;
}

.Box
{
	border-radius : 0.2ex ;
	border : 2px solid oklch(  1.0  0.0  0 / 50%  ) ;

	background-color : oklch(  1.0  0.0  0 / 20%  ) ;

	display : flex ;
	flex-direction : column ;
	padding : 0.48ex 0.3ex ;
	gap : 1.4em ;
}

#Output
{
	line-height : 1.4 ;
	white-space : pre-wrap ;
}

.List
{
	display : flex ;
	flex-direction : column ;
	padding : 1ex ;
	gap : 1px ;

	cursor : default ;
}

.List .Item
{
	background-color : oklch( 1.0  0.0  0 ) ;
	padding : 1px 1ex ;

	display : flex ;
	gap : 1px 1ex ;
	flex-wrap : wrap ;
}

.List .Item:hover
{
	background-color : oklch( 0.95  0.0008  80 ) ;
}

.List .Col
{
	overflow : hidden ;
	white-space : nowrap ;
}

</style>

</head>
<body>
	<main class="Box">
	</main>

<script type="module">

import { ef , DOM , log } from "../js-out-1/Meh/Meh.js" ;
import { Eki } from "../js-out-1/API/Eki.js" ;

const List = ( title , stations ) => ef.section
(
	ef.h2 ( title ) ,
	ef.ul
	(
		{ class : "List" } ,
		... stations.map ( ( m , i ) => Item ( m , i ) ) ,
	)
) ;

const Item = ( m , i ) => ef.li
(
	{ class : "Item" } ,
	column ( 1 + i , "2em" , "center" ) ,
	column ( m.line_cd , "4em" , "center" ) ,
	column ( m.line , "9em" , "center" ) ,
	column ( m.station_cd , "4em" , "left" ) ,
	column ( m.station_name , "12em" , "center" ) ,
	column ( "〒" + m.post , "6em" , "left" ) ,
	column ( m.pref , "4em" , "center" ) ,
	column ( m.address , "16em" , "left" ) ,
) ;

const column = ( text , width , textAlign ) => ef.span
(
	{ class : "Col" , style : { width , textAlign } } ,
	text
) ;

const main = async () =>
{
	const eki = await Eki () ;
	DOM.add ( List ( "北海道" , eki.pref_stations.get ( "1" ) ) , "main" ) ;
	window.scrollTo ( { top : 0 } ) ;
}

main () ;







</script>


</body>
</html>
